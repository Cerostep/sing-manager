# ==============================
# server 配置
# ==============================
server {
    listen 127.0.0.1:18443 ssl default_server;
    server_name _;
    http2 on;
    root /var/www/html;
    index index.html;

    # ==============================
    # TLS 配置（偏严格）
    # ==============================
    ssl_certificate     /etc/nginx/ssl/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/private.key;

    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

    ssl_prefer_server_ciphers off;

    # OCSP Stapling（可选，如果证书支持）
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # resolver 1.1.1.1 8.8.8.8 valid=300s;
    # resolver_timeout 3s;

    # ==============================
    # 日志（核心：记录探测）
    # ==============================
    access_log /var/log/nginx/mask_access.log security_ext;
    error_log  /var/log/nginx/mask_error.log warn;

    # ==============================
    # 基础抗扫描资源限制
    # ==============================
    limit_conn conn_zone 10;
    limit_req zone=req_zone burst=20 nodelay;

    # 连接超时
    client_body_timeout   30s;
    client_header_timeout 30s;
    keepalive_timeout     65s;
    send_timeout          30s;

    client_max_body_size 10m;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # ==============================
    # 安全响应头（静态伪装站点足够）
    # ==============================
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # CSP：严格到极限（静态 HTML 足够）
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # 不缓存（防探测复用）
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    # ==============================
    # 禁止目录索引
    # ==============================
    autoindex off;

    # ==============================
    # 方法限制：只允许 GET / HEAD
    # ==============================
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # ==============================
    # 常见扫描器 UA 黑名单（注意：会误伤 curl/wget）
    # ==============================
    if ($http_user_agent ~* (curl|wget|python|scrapy|httpclient|nmap|masscan|sqlmap|zgrab|gobuster|dirbuster|nikto|fuzz|scanner|bot|spider|crawler)) {
        return 403;
    }

    # ==============================
    # 特征探测：DoH 扫描 /?dns=
    # ==============================
    if ($arg_dns != "") {
        return 403;
    }

    # ==============================
    # 屏蔽敏感文件/目录
    # ==============================
    location ~* (^|/)\.(git|svn|hg) {
        return 404;
    }

    location ~* \.(conf|config|env|ini|log|bak|old|swp|sql|db|yml|yaml|json|xml|md|txt|sh|bash)$ {
        return 404;
    }

    location ~* \.(php|jsp|asp|aspx|cgi|pl|py|rb)$ {
        return 404;
    }

    # ==============================
    # robots.txt：禁止爬虫
    # ==============================
    location = /robots.txt {
        access_log off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # ==============================
    # 404错误处理
    # ==============================
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ==============================
    # 站点入口（静态伪装）
    # ==============================
    location = / {
        try_files /index.html =404;
    }

    location /posts/ {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~* \.html?$ {
        try_files $uri =404;
    }

    location ~* \.css$ {
        expires 7d;
        add_header Content-Type "text/css; charset=utf-8";
        access_log off;
    }

    # 禁止 js（如果你站点不需要）
    location ~* \.js$ {
        return 403;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico)$ {
        expires 30d;
    }

    # 默认：其他全部 try_files
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}