name: Build nginx release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Nginx release URL
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          script = Path("singmanager")
          content = script.read_text()
          content, replacements = re.subn(
              r'(?<=/releases/download/)[^/"]+(?=/nginx\.tar\.gz")',
              lambda _: os.environ["RELEASE_VERSION"],
              content,
              count=1,
          )
          if replacements != 1:
              raise SystemExit("Expected exactly one NGINX_RELEASE_URL release version")
          script.write_text(content)
          PY

      - name: Package nginx
        run: |
          mkdir -p release
          tar -czvf release/nginx.tar.gz nginx

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/nginx.tar.gz
            singmanager
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
